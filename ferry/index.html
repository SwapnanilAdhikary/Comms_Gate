<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Harbor Ferry</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d1b2a; font-family: system-ui, sans-serif; }
  svg { display: block; width: 100%; height: 100%; }
  .board {
    position: fixed; top: 16px; right: 16px; padding: 12px 16px;
    background: #111; color: #ffcc33; border: 3px solid #333; border-radius: 6px;
    font: 600 14px/1.4 ui-monospace, Menlo, monospace; letter-spacing: .08em;
    text-transform: uppercase; min-width: 220px; box-shadow: 0 4px 12px #0008;
    perspective: 480px;
  }
  .board .row { display: flex; justify-content: space-between; gap: 16px; }
  .board .time { display: inline-block; font-size: 28px; color: #fff; background: #222; padding: 2px 8px; border-radius: 3px; min-width: 5ch; text-align: center; transform-origin: center; }
  .board .time.flap { animation: flap .45s ease; }
  /* ponytail: scenery only; the crossing clock does not own the waves */
  .wave { animation: drift 8s linear infinite; }
  @keyframes drift { to { transform: translateX(-80px); } }
  @keyframes flap {
    40% { transform: rotateX(-88deg); }
    60% { transform: rotateX(88deg); }
  }
</style>
</head>
<body>

<svg viewBox="0 0 800 450" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A ferry with a pelican on deck crossing a harbor">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6b26b"/><stop offset="1" stop-color="#fde3c0"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a7ca5"/><stop offset="1" stop-color="#16425b"/>
    </linearGradient>
  </defs>

  <!-- sky + sun -->
  <rect width="800" height="230" fill="url(#sky)"/>
  <circle cx="560" cy="150" r="38" fill="#fff4d6" opacity=".9"/>

  <!-- far shore -->
  <path d="M0 215 Q90 170 180 200 T380 190 T600 195 T800 185 V235 H0Z" fill="#6b8f71"/>
  <g fill="#e8dcc8" stroke="#7a6a58" stroke-width="1">
    <rect x="610" y="178" width="18" height="16"/><rect x="632" y="172" width="14" height="22"/>
    <rect x="650" y="180" width="20" height="14"/>
  </g>
  <path d="M0 230 H800 V236 H0Z" fill="#4f6f55"/>

  <!-- water -->
  <rect y="230" width="800" height="220" fill="url(#sea)"/>
  <g class="wave" stroke="#ffffff55" stroke-width="2" fill="none">
    <path d="M0 270 q20 -6 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0"/>
    <path d="M0 340 q20 -6 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0"/>
    <path d="M0 410 q20 -6 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0"/>
  </g>

  <!-- near dock (left) and far landing (right) -->
  <g fill="#6d4c3d">
    <rect x="0" y="318" width="70" height="12"/>
    <rect x="8" y="330" width="8" height="50"/><rect x="50" y="330" width="8" height="50"/>
  </g>
  <g fill="#6d4c3d">
    <rect x="730" y="318" width="70" height="12"/>
    <rect x="742" y="330" width="8" height="50"/><rect x="784" y="330" width="8" height="50"/>
  </g>

  <!-- ferry: Cursor moves this group along x for the crossing -->
  <g id="ferry-pos" transform="translate(80 0)">
    <!-- wake trails behind the stern (left side when heading right) -->
    <g id="wake" stroke="#ffffffcc" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M-4 352 q-30 4 -60 12"/>
      <path d="M-4 358 q-24 10 -50 22"/>
      <path d="M-10 346 q-20 0 -36 4"/>
    </g>

    <g id="ferry">
      <!-- hull -->
      <path d="M0 330 H200 L184 362 H14 Z" fill="#c0392b"/>
      <rect x="0" y="326" width="200" height="6" fill="#f5f5f5"/>
      <path d="M14 356 H184" stroke="#fff" stroke-width="2"/>
      <!-- deck rail -->
      <path d="M2 326 V312 H198 V326" fill="none" stroke="#ecf0f1" stroke-width="2"/>
      <path d="M30 312 V326 M60 312 V326 M150 312 V326 M180 312 V326" stroke="#ecf0f1" stroke-width="1.5"/>
      <!-- cabin -->
      <rect x="70" y="282" width="80" height="44" rx="3" fill="#fdfefe" stroke="#95a5a6"/>
      <rect x="66" y="278" width="88" height="6" fill="#2c3e50"/>
      <g fill="#5dade2" stroke="#2c3e50" stroke-width="1">
        <rect x="78" y="292" width="14" height="12"/><rect x="98" y="292" width="14" height="12"/>
        <rect x="118" y="292" width="14" height="12"/><rect x="136" y="292" width="8" height="12"/>
      </g>
      <!-- funnel -->
      <rect x="128" y="258" width="14" height="22" fill="#f1c40f" stroke="#2c3e50"/>
      <rect x="128" y="258" width="14" height="5" fill="#2c3e50"/>
      <text id="mark" x="100" y="350" font-size="10" font-family="monospace" fill="#fff" text-anchor="middle">HARBOR LINE</text>

      <!-- pelican standing on the fore deck -->
      <g id="pelican" transform="translate(164 326)">
        <path d="M-2 0 V-10 M4 0 V-10" stroke="#e67e22" stroke-width="2"/>
        <ellipse cx="1" cy="-18" rx="12" ry="9" fill="#f4f1ea" stroke="#999" stroke-width=".8"/>
        <path d="M-10 -18 q8 -6 18 -2" fill="none" stroke="#7f8c8d" stroke-width="2"/>
        <g id="pelican-head">
          <path d="M6 -24 q4 -10 0 -18" fill="none" stroke="#f4f1ea" stroke-width="5" stroke-linecap="round"/>
          <circle cx="6" cy="-44" r="5" fill="#f4f1ea" stroke="#999" stroke-width=".8"/>
          <circle cx="7.5" cy="-45" r="1" fill="#222"/>
          <path d="M10 -45 L32 -40 L10 -42 Z" fill="#f39c12"/>
          <path d="M10 -42 Q22 -32 30 -40" fill="#f5b041" stroke="#d68910" stroke-width=".6"/>
        </g>
      </g>
    </g>
  </g>
</svg>

<div class="board">
  <div class="row"><span>Harbor Line</span><span>Pier 1</span></div>
  <div class="row" style="margin-top:8px;align-items:center">
    <span id="board-status">Next departure</span>
    <span id="board-time" class="time">00:20</span>
  </div>
</div>

<script>
/* One clock: dock countdown, then a crossing out and back, then the next countdown. */
(function () {
  var pos = document.getElementById('ferry-pos');
  var boat = document.getElementById('ferry');
  var wake = document.getElementById('wake');
  var head = document.getElementById('pelican-head');
  var mark = document.getElementById('mark');
  var timeEl = document.getElementById('board-time');

  var LEFT = 80, RIGHT = 520;
  var WAIT = 20000, OUT = 8000, TURN = 2000, BACK = 8000, ALIGN = 2000;
  var SAIL = OUT + TURN + BACK + ALIGN;
  var ZERO = 400;

  var mode = 'wait', acc = 0, last = performance.now();
  var shown = '';

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function fmt(ms) {
    var s = Math.ceil(Math.max(0, ms) / 1000 - 1e-9);
    return pad((s / 60) | 0) + ':' + pad(s % 60);
  }
  function show(ms, flap) {
    var text = fmt(ms);
    if (text === shown) return;
    shown = text;
    timeEl.textContent = text;
    if (!flap) return;
    timeEl.classList.remove('flap');
    void timeEl.offsetWidth;
    timeEl.classList.add('flap');
  }
  function ease(u) { return u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2; }

  function place(x, facing, speed, now) {
    var bob = Math.sin(now / 280) * (1 + speed * 2.2);
    var flip = facing < 0 ? 'translate(200 0) scale(-1 1) ' : '';
    pos.setAttribute('transform', 'translate(' + x.toFixed(1) + ' 0)');
    boat.setAttribute('transform', flip + 'translate(0 ' + bob.toFixed(2) + ')');
    if (facing < 0) mark.setAttribute('transform', 'translate(100 0) scale(-1 1) translate(-100 0)');
    else mark.removeAttribute('transform');
    wake.setAttribute('transform', flip + 'translate(0 ' + bob.toFixed(2) + ')');
    var shimmer = 0.45 + 0.55 * Math.abs(Math.sin(now / 160));
    wake.setAttribute('opacity', (speed * shimmer).toFixed(3));
    var glance = (now % 5400) / 5400;
    var look = glance > 0.72 && glance < 0.9 ? -12 : 0;
    head.setAttribute('transform', 'translate(6 -26) rotate(' + look + ') translate(-6 26)');
  }

  function frame(now) {
    var dt = now - last;
    last = now;
    if (dt > 80) dt = 80;
    acc += dt;

    var departed = false;
    if (mode === 'wait' && acc >= WAIT + ZERO) {
      mode = 'sail';
      acc -= WAIT + ZERO;
      departed = true;
    } else if (mode === 'sail' && acc >= SAIL) {
      mode = 'wait';
      acc -= SAIL;
    }

    if (mode === 'wait') {
      show(Math.max(0, WAIT - acc), false);
      place(LEFT, 1, 0, now);
    } else {
      show(SAIL - acc + WAIT, departed);
      var e = acc, x = LEFT, facing = 1, speed = 0;
      if (e < OUT) {
        var p = e / OUT;
        x = LEFT + (RIGHT - LEFT) * ease(p);
        speed = Math.sin(Math.PI * p);
      } else if (e < OUT + TURN) {
        x = RIGHT;
        facing = e < OUT + TURN / 2 ? 1 : -1;
      } else if (e < OUT + TURN + BACK) {
        var p2 = (e - OUT - TURN) / BACK;
        x = RIGHT + (LEFT - RIGHT) * ease(p2);
        facing = -1;
        speed = Math.sin(Math.PI * p2);
      } else {
        x = LEFT;
        facing = e < OUT + TURN + BACK + ALIGN / 2 ? -1 : 1;
      }
      place(x, facing, speed, now);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>

</body>
</html>
